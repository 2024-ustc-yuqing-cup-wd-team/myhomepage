<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · USTC MyHomePage</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/myhomepage/assets/img/favicon.png" type="image/png">
  <style>
    @font-face {
      font-family: "Instrument Serif";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/myhomepage/assets/fonts/instrument-serif-regular.woff2") format("woff2");
    }
    :root {
      --paper: #f6f1e8;
      --ink: #17140f;
      --muted: #837a6b;
      --line: #e0d7c7;
      --accent: #b4471e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141210;
        --ink: #f2ece2;
        --muted: #9c9283;
        --line: #2c2720;
        --accent: #d9774a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      padding: 2.5rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .code {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(4rem, 14vw, 6.5rem);
      font-weight: 400;
      line-height: 0.9;
      color: var(--accent);
    }
    h1 {
      margin: 1.2rem 0 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.7rem;
      font-weight: 400;
    }
    p {
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      margin-top: 1.8rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--accent);
      color: var(--ink);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">USTC MyHomePage</p>
    <p class="code">404</p>
    <h1>This page is not on the calendar.</h1>
    <p>The link may be outdated, or the page may have moved. Head back to the start and pick up from there.</p>
    <a href="/myhomepage/">Back to the home page</a>
  </div>
</body>
</html>
